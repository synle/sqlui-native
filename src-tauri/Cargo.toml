[package]
name = "sqlui-native"
version = "2.76.4"
edition = "2021"
description = "A cross-platform desktop SQL/NoSQL database client"
authors = ["Sy Le"]
license = "MIT"

[lib]
name = "sqlui_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["devtools"] }
tauri-plugin-shell = "=2.5.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
