name: Test (Unit / Integration / E2E Tests)

on:
  schedule:
    - cron: "0 0 * * *" # daily, midnight UTC
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "24"
      run_e2e:
        type: boolean
        default: true
      run_integration:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version"
        default: "24"
      run_e2e:
        description: "Run E2E (Playwright) tests"
        type: boolean
        default: true
      run_integration:
        description: "Run integration tests"
        type: boolean
        default: true

concurrency:
  group: integration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  # ---- Check if there are recent changes ----
  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }} # fetch latest branch tip (includes prep commits)
          fetch-depth: 0
      - name: Check for changes in the last 24 hours
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Only gate on recent changes for scheduled (cron) runs
            if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes in the last 24 hours, skipping."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Always run for push, workflow_dispatch, and workflow_call
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ---- Unit Tests ----
  unit_tests:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }} # fetch latest branch tip (includes prep commits)

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version || '24' }}
          cache: "npm"

      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci || npm install --no-fund --prefer-offline

      - name: Run prebuild
        run: npm run prebuild

      - name: Record tests start time
        run: echo "TESTS_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run unit tests
        id: tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=unit-test-results.xml --coverage.enabled

      - name: Record tests end time
        if: ${{ always() }}
        run: echo "TESTS_END=$(date +%s)" >> $GITHUB_ENV

      - name: Publish unit test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: unit-test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Write test summary
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "## :x: Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :white_check_mark: Unit Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f unit-test-results.xml ]; then
            TOTAL=$(grep -o 'tests="[0-9]*"' unit-test-results.xml | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' unit-test-results.xml | head -1 | grep -o '[0-9]*')
            ERRORS=$(grep -o 'errors="[0-9]*"' unit-test-results.xml | head -1 | grep -o '[0-9]*')
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total tests | ${TOTAL:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | ${FAILURES:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | ${ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
      # Posts a consolidated coverage table to the GitHub Actions job summary
      # AND enforces baselines. Baselines are the numbers captured when this
      # pipeline was introduced — coverage must not regress below them. Bump
      # MIN_* values when coverage genuinely improves so the new floor sticks.
      - name: Report and enforce JS/TS coverage
        id: js_coverage
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        shell: bash
        env:
          MIN_STATEMENTS: "48"
          MIN_BRANCHES: "37"
          MIN_FUNCTIONS: "51"
          MIN_LINES: "49"
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## :bar_chart: JS/TS Code Coverage (Unit Tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f coverage/coverage-summary.json ]; then
            echo ":warning: \`coverage/coverage-summary.json\` not produced — cannot report or enforce thresholds." >> $GITHUB_STEP_SUMMARY
            echo "::error::coverage/coverage-summary.json missing"
            exit 1
          fi

          STMTS=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
          BRANCH=$(node -e "console.log(require('./coverage/coverage-summary.json').total.branches.pct)")
          FUNCS=$(node -e "console.log(require('./coverage/coverage-summary.json').total.functions.pct)")
          LINES=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")

          fail=0
          row() {
            local name=$1 definition=$2 actual=$3 min=$4
            local status
            if awk -v a="$actual" -v m="$min" 'BEGIN { exit (a + 0 < m + 0) ? 0 : 1 }'; then
              status=":x: FAIL"
              echo "::error::${name} coverage ${actual}% is below baseline ${min}%"
              fail=1
            else
              status=":white_check_mark: pass"
            fi
            echo "| ${name} | ${definition} | ${min}% | ${actual}% | ${status} |" >> $GITHUB_STEP_SUMMARY
          }

          echo "| Metric | Definition | Baseline (min) | Actual | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------------|----------------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          row "Statements" "% of executable statements run by tests"          "$STMTS"  "$MIN_STATEMENTS"
          row "Branches"   "% of conditional branches (if/else, &&, ?:) taken" "$BRANCH" "$MIN_BRANCHES"
          row "Functions"  "% of declared functions invoked at least once"     "$FUNCS"  "$MIN_FUNCTIONS"
          row "Lines"      "% of source lines executed at least once"          "$LINES"  "$MIN_LINES"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scope: \`src/**/*.{ts,tsx}\` — frontend + Node backend combined. Excludes \`*.spec.*\` and \`*.integration.spec.*\`. Provider: \`@vitest/coverage-v8\`. Source of truth: \`coverage/coverage-summary.json\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$fail" -ne 0 ]; then
            echo ":x: **JS/TS coverage regressed below baseline — see annotations above.** To raise the floor, edit \`MIN_*\` in \`.github/workflows/integration-test.yml\`." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo ":white_check_mark: **All JS/TS coverage metrics meet or exceed baseline.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Record typecheck start time
        if: ${{ always() }}
        run: echo "TYPECHECK_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run typecheck
        id: typecheck
        run: npm run typecheck

      - name: Record typecheck end / lint start time
        if: ${{ always() }}
        run: |
          echo "TYPECHECK_END=$(date +%s)" >> $GITHUB_ENV
          echo "LINT_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run lint
        id: lint
        run: npm run lint

      - name: Record lint end time
        if: ${{ always() }}
        run: echo "LINT_END=$(date +%s)" >> $GITHUB_ENV

      - name: Summary of all checks
        if: ${{ always() }}
        shell: bash
        run: |
          format_duration() {
            local s=$1
            if [ "${s:-0}" -ge 60 ]; then
              printf "%dm %ds" $((s / 60)) $((s % 60))
            else
              printf "%ds" "${s:-0}"
            fi
          }

          JOB_END=$(date +%s)
          TESTS_DUR=$(( ${TESTS_END:-$JOB_END} - ${TESTS_START:-$JOB_END} ))
          TYPECHECK_DUR=$(( ${TYPECHECK_END:-$JOB_END} - ${TYPECHECK_START:-$JOB_END} ))
          LINT_DUR=$(( ${LINT_END:-$JOB_END} - ${LINT_START:-$JOB_END} ))
          TOTAL_DUR=$(( JOB_END - ${JOB_START:-$JOB_END} ))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.tests.outcome == 'success' && ':white_check_mark: Passed' || ':x: Failed' }} | $(format_duration $TESTS_DUR) |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeCheck | ${{ steps.typecheck.outcome == 'success' && ':white_check_mark: Passed' || ':x: Failed' }} | $(format_duration $TYPECHECK_DUR) |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome == 'success' && ':white_check_mark: Passed' || ':x: Failed' }} | $(format_duration $LINT_DUR) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | | **$(format_duration $TOTAL_DUR)** |" >> $GITHUB_STEP_SUMMARY

  # ---- Rust / Tauri Unit Tests + Coverage ----
  # Runs `cargo llvm-cov --lib` against src-tauri/ and enforces the coverage
  # baselines captured when this job was introduced. Coverage that regresses
  # below the baselines fails the build. Bump the MIN_* values when coverage
  # genuinely improves.
  rust_unit_tests:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Tauri's build.rs requires src-tauri/resources/ to exist before any
      # cargo invocation, even when we are only compiling the lib for tests.
      - name: Prepare Tauri resources dir
        run: mkdir -p src-tauri/resources

      - name: Record Rust tests start time
        run: echo "RUST_TESTS_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run Rust unit tests with coverage
        id: rust_tests
        working-directory: src-tauri
        run: |
          # Run tests once, then emit both JSON (for threshold enforcement) and
          # LCOV (for the uploaded artifact) from the same profdata.
          cargo llvm-cov --lib --no-report
          cargo llvm-cov report --json --summary-only --output-path rust-coverage.json
          cargo llvm-cov report --lcov --output-path rust-coverage.lcov
          cargo llvm-cov report --summary-only

      - name: Record Rust tests end time
        if: ${{ always() }}
        run: echo "RUST_TESTS_END=$(date +%s)" >> $GITHUB_ENV

      - name: Upload Rust coverage artifacts
        if: ${{ always() && steps.rust_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            src-tauri/rust-coverage.json
            src-tauri/rust-coverage.lcov
          retention-days: 14

      # Posts a consolidated Rust coverage table to the GitHub Actions job
      # summary AND enforces baselines (same pattern as the JS/TS job above).
      - name: Report and enforce Rust coverage
        id: rust_coverage
        if: ${{ always() && steps.rust_tests.outcome != 'skipped' }}
        shell: bash
        env:
          MIN_LINES: "19.08"
          MIN_REGIONS: "19.14"
          MIN_FUNCTIONS: "44.44"
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## :bar_chart: Rust Code Coverage (Unit Tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f src-tauri/rust-coverage.json ]; then
            echo ":warning: \`src-tauri/rust-coverage.json\` not produced — cannot report or enforce thresholds." >> $GITHUB_STEP_SUMMARY
            echo "::error::src-tauri/rust-coverage.json missing"
            exit 1
          fi

          LINES=$(python3 -c "import json; print(round(json.load(open('src-tauri/rust-coverage.json'))['data'][0]['totals']['lines']['percent'], 2))")
          REGIONS=$(python3 -c "import json; print(round(json.load(open('src-tauri/rust-coverage.json'))['data'][0]['totals']['regions']['percent'], 2))")
          FUNCS=$(python3 -c "import json; print(round(json.load(open('src-tauri/rust-coverage.json'))['data'][0]['totals']['functions']['percent'], 2))")

          fail=0
          row() {
            local name=$1 definition=$2 actual=$3 min=$4
            local status
            if awk -v a="$actual" -v m="$min" 'BEGIN { exit (a + 0 < m + 0) ? 0 : 1 }'; then
              status=":x: FAIL"
              echo "::error::${name} coverage ${actual}% is below baseline ${min}%"
              fail=1
            else
              status=":white_check_mark: pass"
            fi
            echo "| ${name} | ${definition} | ${min}% | ${actual}% | ${status} |" >> $GITHUB_STEP_SUMMARY
          }

          echo "| Metric | Definition | Baseline (min) | Actual | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------------|----------------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          row "Lines"     "% of source lines executed at least once"                                "$LINES"   "$MIN_LINES"
          row "Regions"   "% of llvm-cov regions (finer-grained than lines: per-branch arc) covered" "$REGIONS" "$MIN_REGIONS"
          row "Functions" "% of declared functions invoked at least once"                            "$FUNCS"   "$MIN_FUNCTIONS"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scope: \`src-tauri/src/**/*.rs\` (lib target only). Provider: \`cargo-llvm-cov\` (LLVM source-based coverage). Code gated by \`#[cfg(not(debug_assertions))]\` or \`#[cfg(target_os = ...)]\` is not compiled in the test profile and therefore not measured. Source of truth: \`src-tauri/rust-coverage.json\` (uploaded as \`rust-coverage\` artifact)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$fail" -ne 0 ]; then
            echo ":x: **Rust coverage regressed below baseline — see annotations above.** To raise the floor, edit \`MIN_*\` in \`.github/workflows/integration-test.yml\`." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo ":white_check_mark: **All Rust coverage metrics meet or exceed baseline.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Rust job duration summary
        if: ${{ always() }}
        shell: bash
        run: |
          format_duration() {
            local s=$1
            if [ "${s:-0}" -ge 60 ]; then
              printf "%dm %ds" $((s / 60)) $((s % 60))
            else
              printf "%ds" "${s:-0}"
            fi
          }
          END=$(date +%s)
          DUR=$(( ${RUST_TESTS_END:-$END} - ${RUST_TESTS_START:-$END} ))
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Unit Tests + Coverage | $(format_duration $DUR) |" >> $GITHUB_STEP_SUMMARY

  # ---- Integration Tests ----
  integration_test:
    needs: check
    if: ${{ needs.check.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
    services:
      # Relational Databases
      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: password123!
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: password123!
        ports:
          - 33061:3306
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "password123!"
        ports:
          - 1433:1433
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: password123!
        ports:
          - 5432:5432

      # NoSQL & Caching
      cassandra_v4:
        image: cassandra:4
        env:
          CASSANDRA_USERNAME: cassandra
          CASSANDRA_PASSWORD: cassandra
        ports:
          - 9042:9042
      cassandra_v2:
        image: cassandra:2
        env:
          CASSANDRA_USERNAME: cassandra
          CASSANDRA_PASSWORD: cassandra
        ports:
          - 9043:9042
      mongodb:
        image: mongo
        ports:
          - 27017:27017
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }} # fetch latest branch tip (includes prep commits)

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version || '24' }}
          cache: "npm"

      - run: |
          node scripts/prebuild.js
          npm ci || npm install --no-fund --prefer-offline
          node scripts/postbuild.js

      # wait for databases to be ready
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Wait for databases to be ready
        run: |
          echo "Waiting for databases to initialize..."
          sleep 5m  # sleep for n mins

      - name: Record integration tests start time
        run: echo "TESTS_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run integration tests
        id: integration_tests
        # Integration test secrets for cloud-based adapters (not containerized via Docker).
        # Each secret must be mapped here manually (one per line).
        # When adding a new cloud adapter integration test, add its secret here too.
        # SECURITY: These contain real credentials. Never log or echo these values.
        # Cloud secrets are only injected when run_integration is true (release builds).
        # When false (build-main), cloud tests self-skip via their process.env checks.
        env:
          TEST_AZ_TABLE_STORAGE_CONNECTION: ${{ inputs.run_integration && secrets.TEST_AZ_TABLE_STORAGE_CONNECTION || '' }}
          TEST_AZ_COSMOSDB_CONNECTION: ${{ inputs.run_integration && secrets.TEST_AZ_COSMOSDB_CONNECTION || '' }}
          TEST_SFDC_CONNECTION: ${{ inputs.run_integration && secrets.TEST_SFDC_CONNECTION || '' }}
        run: npx vitest run --config vitest.integration.config.ts --reporter=default --reporter=junit --outputFile.junit=integration-test-results.xml

      - name: Record integration tests end time
        if: ${{ always() }}
        run: echo "TESTS_END=$(date +%s)" >> $GITHUB_ENV

      - name: Publish integration test results
        if: ${{ always() && steps.integration_tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test Results
          path: integration-test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Write integration test summary
        if: ${{ always() }}
        shell: bash
        run: |
          format_duration() {
            local s=$1
            if [ "${s:-0}" -ge 60 ]; then
              printf "%dm %ds" $((s / 60)) $((s % 60))
            else
              printf "%ds" "${s:-0}"
            fi
          }

          JOB_END=$(date +%s)
          TESTS_DUR=$(( ${TESTS_END:-$JOB_END} - ${TESTS_START:-$JOB_END} ))
          TOTAL_DUR=$(( JOB_END - ${JOB_START:-$JOB_END} ))

          if [ "${{ steps.integration_tests.outcome }}" = "failure" ]; then
            echo "## :x: Integration Tests Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :white_check_mark: Integration Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the **Integration Test Results** check for per-test details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f integration-test-results.xml ]; then
            TOTAL=$(grep -o 'tests="[0-9]*"' integration-test-results.xml | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' integration-test-results.xml | head -1 | grep -o '[0-9]*')
            ERRORS=$(grep -o 'errors="[0-9]*"' integration-test-results.xml | head -1 | grep -o '[0-9]*')
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total tests | ${TOTAL:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | ${FAILURES:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | ${ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | $(format_duration $TESTS_DUR) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total (incl. DB wait)** | **$(format_duration $TOTAL_DUR)** |" >> $GITHUB_STEP_SUMMARY

  # ---- E2E Tests (Playwright) ----
  e2e_test:
    needs: check
    if: ${{ needs.check.outputs.has_changes == 'true' && inputs.run_e2e == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version || '24' }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install --no-fund --prefer-offline

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend and server for E2E
        run: |
          npm run build

      - name: Record E2E tests start time
        run: echo "E2E_START=$(date +%s)" >> $GITHUB_ENV

      - name: Run E2E tests
        id: e2e_tests
        run: npx playwright test

      - name: Record E2E tests end time
        if: ${{ always() }}
        run: echo "E2E_END=$(date +%s)" >> $GITHUB_ENV

      - name: Upload Playwright report
        if: ${{ always() && steps.e2e_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          compression-level: 0

      - name: Upload test screenshots
        if: ${{ always() && steps.e2e_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 14
          compression-level: 0

      - name: Publish E2E test results
        if: ${{ always() && steps.e2e_tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: E2E Test Results
          path: e2e-test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Write E2E test summary
        if: ${{ always() }}
        shell: bash
        run: |
          format_duration() {
            local s=$1
            if [ "${s:-0}" -ge 60 ]; then
              printf "%dm %ds" $((s / 60)) $((s % 60))
            else
              printf "%ds" "${s:-0}"
            fi
          }

          E2E_DUR=$(( ${E2E_END:-$(date +%s)} - ${E2E_START:-$(date +%s)} ))

          if [ "${{ steps.e2e_tests.outcome }}" = "failure" ]; then
            echo "## :x: E2E Tests Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :white_check_mark: E2E Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the **E2E Test Results** check and **playwright-report** artifact for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f e2e-test-results.xml ]; then
            TOTAL=$(grep -o 'tests="[0-9]*"' e2e-test-results.xml | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' e2e-test-results.xml | head -1 | grep -o '[0-9]*')
            ERRORS=$(grep -o 'errors="[0-9]*"' e2e-test-results.xml | head -1 | grep -o '[0-9]*')
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total tests | ${TOTAL:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | ${FAILURES:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | ${ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | $(format_duration $E2E_DUR) |" >> $GITHUB_STEP_SUMMARY
